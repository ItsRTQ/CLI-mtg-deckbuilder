[project]
name = "cli-mtg-deckbuilder"
version = "0.8.0"
description = "Local CLI tool for building Magic: The Gathering Commander decks."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "typer",
    "rich",
    "python-dotenv",
    "pydantic",
    "ijson",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mtg = "mtgcli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]